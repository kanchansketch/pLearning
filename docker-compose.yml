# pLearning – Docker Compose
# ──────────────────────────────────────────────────────────────
version: "3.9"

services:
  # ── FastAPI Backend ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plearning-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - plearning-data:/app/data
    environment:
      - PYTHONPATH=/app/src
      - DATABASE_URL=sqlite+aiosqlite:///app/data/plearning.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── Nginx Frontend ────────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: plearning-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  plearning-data:
    driver: local
